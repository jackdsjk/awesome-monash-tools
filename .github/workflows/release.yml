name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm CLI for OIDC.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, so no long-lived secret exists in this repository.
      - run: npm publish --provenance --access public
